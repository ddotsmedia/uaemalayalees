services:
  app:
    image: ${APP_IMAGE:?set by the deploy workflow}
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3001:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend
      - default
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  backend:
    internal: true

volumes:
  redis_data:
