name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        run: echo "IMAGE_REF=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_REF }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

          SSH=(ssh -i "$HOME/.ssh/deploy_key" -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o BatchMode=yes "${VPS_USER}@${VPS_HOST}")
          APP_DIR=/opt/uaemalayalees

          # Keep the server's compose file in step with this commit
          "${SSH[@]}" "cat > ${APP_DIR}/docker-compose.prod.yml" < docker-compose.prod.yml

          # Registry login on the VPS; the token travels over stdin, not the command line
          printf '%s' "$GHCR_TOKEN" | "${SSH[@]}" "docker login ghcr.io -u '${GHCR_ACTOR}' --password-stdin"

          # Pull the new image and start it; --wait fails the job if the container HEALTHCHECK does not pass
          "${SSH[@]}" "cd ${APP_DIR} && test -f .env && \
            APP_IMAGE='${IMAGE_REF}:${GITHUB_SHA}' docker compose -f docker-compose.prod.yml pull app && \
            APP_IMAGE='${IMAGE_REF}:${GITHUB_SHA}' docker compose -f docker-compose.prod.yml up -d --wait --wait-timeout 120"
